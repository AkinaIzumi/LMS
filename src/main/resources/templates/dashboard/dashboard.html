<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/master :: head('Dashboard')}"></head>
<body>
<div class="app-shell">
  <div th:replace="~{layout/sidebar :: sidebar('dashboard')}"></div>
  <main class="main-area">
    <div th:replace="~{layout/navbar :: navbar}"></div>
    <div class="content-wrap">
      <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item active">Dashboard</li></ol></nav>
      
      <!-- 📊 Stat Cards (Dynamic) -->
      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card p-3 d-flex align-items-center gap-3">
                <div class="stat-icon"><i class="bi bi-book"></i></div>
                <div><div class="text-muted">Total Books</div><div class="h3 mb-0" th:text="${totalBooks}">0</div><small>Books</small></div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card p-3 d-flex align-items-center gap-3">
                <div class="stat-icon"><i class="bi bi-people"></i></div>
                <div><div class="text-muted">Total Members</div><div class="h3 mb-0" th:text="${totalMembers}">0</div><small>Members</small></div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card p-3 d-flex align-items-center gap-3">
                <div class="stat-icon"><i class="bi bi-arrow-left-right"></i></div>
                <div><div class="text-muted">Borrowed Books</div><div class="h3 mb-0" th:text="${borrowedCount}">0</div><small>Borrowed</small></div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card p-3 d-flex align-items-center gap-3">
                <div class="stat-icon"><i class="bi bi-exclamation-triangle"></i></div>
                <div><div class="text-muted">Overdue Books</div><div class="h3 mb-0" th:text="${overdueCount}">0</div><small>Overdue</small></div>
            </div>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="d-flex flex-wrap gap-2 mb-4">
        <a class="btn btn-matcha" href="/books/create"><i class="bi bi-plus-lg me-1"></i>Add Book</a>
        <a class="btn btn-matcha" href="/members/create"><i class="bi bi-person-plus me-1"></i>Add Member</a>
        <a class="btn btn-primary" href="/transactions/borrow"><i class="bi bi-arrow-repeat me-1"></i>Borrow Book</a>
      </div>

      <!-- Recent Transactions Table (Dynamic Loop) -->
      <section class="page-card p-3">
        <h2 class="h5 fw-bold mb-3">Recent Borrow Transactions</h2>
        <div class="table-responsive">
          <table class="table align-middle datatable">
            <thead>
                <tr><th>Member</th><th>Book</th><th>Borrow Date</th><th>Due Date</th><th>Status</th></tr>
            </thead>
            <tbody>
              <!-- 💡 Loop ဖြင့် အချက်အလက်များ ထည့်သွင်းခြင်း -->
              <tr th:each="tx : ${recentTransactions}">
                <td th:text="${tx.member != null ? tx.member.name : 'N/A'}">Aye Chan</td>
                <td th:text="${tx.book != null ? tx.book.title : 'N/A'}">Java Programming</td>
                <td th:text="${tx.borrowDate}">2026-07-20</td>
                <td th:text="${tx.dueDate}">2026-07-27</td>
                <td>
                    <span class="badge" 
                          th:classappend="${tx.status == 'BORROWED' ? 'badge-borrowed' : (tx.status == 'OVERDUE' ? 'badge-overdue' : 'badge-returned')}" 
                          th:text="${tx.status}">Borrowed</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <div th:replace="~{layout/footer :: footer}"></div>
    </div>
  </main>
</div>
<div th:replace="~{layout/master :: scripts}"></div>
</body>
</html>
