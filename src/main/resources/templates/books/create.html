<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head('Create Book')}"></head>

<body>
<div class="app-shell">

    <div th:replace="~{layout/sidebar :: sidebar('books')}"></div>

    <main class="main-area">

        <div th:replace="~{layout/navbar :: navbar('Create Book')}"></div>

        <div class="content-wrap">

            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="/books">Books</a></li>
                    <li class="breadcrumb-item active">Create</li>
                </ol>
            </nav>

            <div class="page-card p-4">
                <h1 class="h4 mb-4">Add New Book</h1>

                <form id="bookForm" th:object="${book}">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="Enter Book Title" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="author" class="form-label">Author</label>
                            <input type="text" id="author" th:field="*{author}" class="form-control" placeholder="Enter Author Name" required>
                        </div>
                    </div>

                    <div class="row">
        
                        <div class="col-md-6 mb-3">
                            <label for="price" class="form-label">Price (MMK)</label>
                            <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="category" class="form-label">Category</label>
                            <select id="category" th:field="*{category.id}" class="form-select" required>
                                <option value="">Select Category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="totalQuantity" class="form-label">Total Quantity</label>
                            <input type="number" id="totalQuantity" th:field="*{totalQuantity}" class="form-control" placeholder="0" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="availableQuantity" class="form-label">Available Quantity</label>
                            <input type="number" id="availableQuantity" th:field="*{availableQuantity}" class="form-control" placeholder="0" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select id="status" th:field="*{status}" class="form-select" required>
                                <option value="Available">Available</option>
                                <option value="Borrowed">Borrowed</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-matcha">
                            <i class="bi bi-save"></i> Save 
                        </button>
                        <a href="/books" class="btn btn-secondary">Cancel</a>
                    </div>

                </form>
            </div>

            <div th:replace="~{layout/footer :: footer}"></div>

        </div>

    </main>

</div>

<div th:replace="~{layout/master :: scripts}"></div>

<!-- JavaScript Fetch API for Book Creation -->
<script>
document.getElementById("bookForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const book = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        price: document.getElementById("price").value,
        category: {
            id: document.getElementById("category").value
        },
        totalQuantity: document.getElementById("totalQuantity").value,
        availableQuantity: document.getElementById("availableQuantity").value,
        status: document.getElementById("status").value
    };

    try {
        const response = await fetch("/api/books", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(book)
        });

        if (response.ok) {
            alert("Book created successfully.");
            window.location.href = "/books";
        } else {
            alert("Failed to create book.");
        }
    } catch (error) {
        console.error("Error:", error);
        alert("An error occurred.");
    }
});
</script>

</body>
</html>
