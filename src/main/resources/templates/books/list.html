<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head('Books')}"></head>

<body>
<div class="app-shell">

    <div th:replace="~{layout/sidebar :: sidebar('books')}"></div>

    <main class="main-area">

        <div th:replace="~{layout/navbar :: navbar('Books')}"></div>

        <div class="content-wrap">

            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="/dashboard">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active">Books</li>
                </ol>
            </nav>

            <div class="page-card p-3">

                <div class="d-flex justify-content-between mb-3">
                    <h1 class="h4">Books</h1>

                    <a href="/books/create" class="btn btn-matcha">
                        <i class="bi bi-plus-lg"></i>
                        Create
                    </a>
                </div>

                <table class="table table-striped table-bordered datatable w-100">

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>ISBN</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Total Qty</th>
                        <th>Available Qty</th> 
                        <th>Status</th>
                        <th>Created Date</th>
                        <th>Action</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="book : ${books}">

                        <td th:text="${book.id}"></td>

                        <td th:text="${book.isbn}"></td>

                        <td th:text="${book.title}"></td>

                        <td th:text="${book.author}"></td>

                        <td th:text="${book.price}"></td>

                        <td th:text="${book.category != null ? book.category.name : '-'}"></td>

                        <td th:text="${book.totalQuantity}"></td>

                        <td th:text="${book.availableQuantity}"></td>


                        <td>
                            <span class="badge"
                                  th:classappend="${book.status=='Available'}?'badge-available':'badge-borrowed'"
                                  th:text="${book.status}">
                            </span>
                        </td>

                        <td th:text="${book.createdAt != null ? #temporals.format(book.createdAt,'yyyy-MM-dd') : '-'}"></td>

                        <td class="text-center">

                            <a class="btn btn-info btn-sm text-white"
                               th:href="@{/books/history/{id}(id=${book.id})}">
                                <i class="bi bi-clock-history"></i>
                            </a>

                            <a class="btn btn-warning btn-sm"
                               th:href="@{/books/edit/{id}(id=${book.id})}">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <form th:action="@{/books/delete/{id}(id=${book.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this category?');">
                                        <button type="submit" class="btn btn-sm btn-danger" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div th:replace="~{layout/footer :: footer}"></div>

        </div>

    </main>

</div>

    <!-- DataTables CSS & JS Dependencies -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    
    <div th:replace="~{layout/master :: scripts}"></div>

<script>
$(function () {

    if (!$.fn.DataTable.isDataTable('.datatable')) {

        $('.datatable').DataTable({
            responsive: true,
            autoWidth: false,
            pageLength: 10,
            columnDefs: [
                {
                    orderable: false,
                    targets: 9
                }
            ]
        });

    }

});
</script>

</body>
</html>
