<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head('Create Category')}"></head>

<body>

<div class="app-shell">

    <!-- Sidebar -->
    <div th:replace="~{layout/sidebar :: sidebar('categories')}"></div>

    <main class="main-area">

        <!-- Navbar -->
        <div th:replace="~{layout/navbar :: navbar('Create Category')}"></div>

        <div class="content-wrap">

            <!-- Breadcrumb -->
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="/dashboard">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a href="/categories">Categories</a>
                    </li>
                    <li class="breadcrumb-item active">
                        Create
                    </li>
                </ol>
            </nav>

            <!-- Card -->
            <div class="page-card p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h4 mb-0">Create Category</h2>
                </div>

                <form id="categoryForm">

                    <div class="mb-3">
                        <label class="form-label">
                            Category Name
                        </label>

                        <input
                                type="text"
                                id="name"
                                class="form-control"
                                placeholder="Enter category name"
                                required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                                id="description"
                                class="form-control"
                                rows="4"
                                placeholder="Enter description"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="shelfLocation" class="form-label">Shelf Location</label>
                        <input type="text" class="form-control" id="shelfLocation" placeholder="eg-A1">
                    </div>

                    <div class="d-flex gap-2">

                        <button
                                type="submit"
                                class="btn btn-matcha">

                            <i class="bi bi-check-circle me-1"></i>
                            Save

                        </button>

                        <a href="/categories"
                           class="btn btn-secondary">

                            <i class="bi bi-arrow-left me-1"></i>
                            Back

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

<!-- Scripts -->
<div th:replace="~{layout/master :: scripts}"></div>

<script>
document.getElementById("categoryForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const category = {
        name: document.getElementById("name").value,
        description: document.getElementById("description").value,
        shelfLocation: document.getElementById("shelfLocation").value
    };

    const response = await fetch("/api/categories", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(category)
    });

    if (response.ok) {
        alert("Category created successfully.");
        window.location.href = "/categories";
    } else {
        alert("Failed to create category.");
    }

});
</script>

</body>
</html>
