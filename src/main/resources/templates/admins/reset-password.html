<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head('Reset Password')}"></head>

<body>
  <div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('admins')}"></div>
    <main class="main-area">
      <div th:replace="~{layout/navbar :: navbar}"></div>
      <div class="content-wrap">
        <nav>
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/admin-management">Admin Management</a></li>
            <li class="breadcrumb-item active">Reset Password</li>
          </ol>
        </nav>
        <div class="page-card p-4">
          <h1 class="h4 mb-3">Reset Password</h1>

          <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
          <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

         <form th:action="@{/admin-management/reset-password/{id}(id=${resetPasswordForm.id})}" th:object="${resetPasswordForm}" method="post">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Admin Name</label>
                <input class="form-control" th:field="*{name}" readonly />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" th:field="*{email}" readonly />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">New Password</label>
                <input class="form-control" type="password" th:field="*{newPassword}" placeholder="Enter new password" required />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Confirm Password</label>
                <input class="form-control" type="password" th:field="*{confirmPassword}" placeholder="Confirm new password" required />
              </div>
            </div>

            <div class="mt-4">
              <a class="btn btn-light" href="/admin-management">Cancel</a>
              <button class="btn btn-matcha" type="submit">Reset Password</button>
            </div>
          </form>
        </div>
        <div th:replace="~{layout/footer :: footer}"></div>
      </div>
    </main>
  </div>
  <div th:replace="~{layout/master :: scripts}"></div>
</body>

</html>
