<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    
  <head th:replace="~{layout/master :: head('Admin Management')}"></head>

 <body>
    <div class="app-shell">
      <div th:replace="~{layout/sidebar :: sidebar('admins')}"></div>
      <main class="main-area">
        <div th:replace="~{layout/navbar :: navbar}"></div>
        <div class="content-wrap">
          <nav>
            <ol class="breadcrumb">
              <li class="breadcrumb-item">
                <a href="/dashboard">Dashboard</a>
              </li>
              <li class="breadcrumb-item active">Admin Management</li>
            </ol>
          </nav>
          <div class="page-card p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h1 class="h4 mb-0">Admin Management</h1>
              <a class="btn btn-matcha" href="/admin-management/create"
                ><i class="bi bi-person-plus me-1"></i>Create Admin</a
              >
            </div>
            <div
              th:if="${successMessage}"
              class="alert alert-success"
              th:text="${successMessage}"
            ></div>
            <div
              th:if="${errorMessage}"
              class="alert alert-danger"
              th:text="${errorMessage}"
            ></div>
            <table class="table align-middle datatable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Created Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="admin : ${admins}">
                  <td th:text="${admin.id}"></td>
                  <td th:text="${admin.name}"></td>
                  <td th:text="${admin.username}"></td>
                  <td th:text="${admin.email}"></td>
                  <td th:text="${admin.role}"></td>
                  <td>
                    <span class="badge" 
                      th:classappend="${admin.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-danger'" 
                      th:text="${admin.status}">
                      ACTIVE
                    </span>
                  </td>
                  <td
                    th:text="${#temporals.format(admin.createdAt, 'yyyy-MM-dd')}"
                  ></td>
                  <td class="d-flex gap-1">
                    <!-- 1. EDIT BUTTON (ሁሉም admin ಗಳಿಗೆ ပေါ်မည်) -->
                    <a
                      class="btn btn-sm btn-warning"
                      th:href="@{/admin-management/edit/{id}(id=${admin.id})}"
                      title="Edit Admin"
                    ><i class="bi bi-pencil"></i></a>

                    <!-- MAIN_ADMIN ဖြစ်ပါက Shield Lock ခလုတ်ပြမည် (Disable လုပ်၍မရပါ) -->
                    <span th:if="${admin.role == T(com.library.management.model.Role).MAIN_ADMIN}">
                      <button
                        class="btn btn-sm btn-secondary"
                        disabled
                        title="Main admin cannot be disabled"
                      >
                        <i class="bi bi-shield-lock"></i>
                      </button>
                    </span>

                    <!-- MAIN_ADMIN မဟုတ်မှသာ Reset Password နှင့် Disable/Enable ခလုတ်များ ပေါ်မည် -->
                    <span th:if="${admin.role != T(com.library.management.model.Role).MAIN_ADMIN}">
                      <!-- 2. RESET PASSWORD BUTTON -->
                      <a
                        class="btn btn-sm btn-info"
                        th:href="@{/admin-management/reset-password/{id}(id=${admin.id})}"
                        title="Reset Password"
                      ><i class="bi bi-key"></i></a>

                      <!-- 3. DISABLE BUTTON (Status ACTIVE ဖြစ်မှ ပေါ်မည်) -->
                      <form
                        th:action="@{/admin-management/disable/{id}(id=${admin.id})}"
                        method="post"
                        class="d-inline"
                        onsubmit="return confirm('Are you sure you want to disable this Admin account?');"
                        th:if="${admin.status == T(com.library.management.model.AccountStatus).ACTIVE}"
                      >
                        <input
                          type="hidden"
                          th:if="${_csrf != null}"
                          th:name="${_csrf.parameterName}"
                          th:value="${_csrf.token}"
                        />
                        <button class="btn btn-sm btn-danger" type="submit" title="Disable Admin">
                          <i class="bi bi-person-x"></i>
                        </button>
                      </form>

                      <!-- ENABLE BUTTON (Status INACTIVE ဖြစ်မှ ပေါ်မည်) -->
                      <form
                        th:action="@{/admin-management/enable/{id}(id=${admin.id})}"
                        method="post"
                        class="d-inline"
                        onsubmit="return confirm('Are you sure you want to enable this Admin account?');"
                        th:if="${admin.status == T(com.library.management.model.AccountStatus).INACTIVE}"
                      >
                        <input
                          type="hidden"
                          th:if="${_csrf != null}"
                          th:name="${_csrf.parameterName}"
                          th:value="${_csrf.token}"
                        />
                        <button class="btn btn-sm btn-success" type="submit" title="Enable Admin">
                          <i class="bi bi-person-check"></i>
                        </button>
                      </form>
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div th:replace="~{layout/footer :: footer}"></div>
        </div>
      </main>
    </div>
    <div th:replace="~{layout/master :: scripts}"></div>
 </body>

</html>
