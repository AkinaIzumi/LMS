<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head('Edit Member')}"></head>

<body>
<div class="app-shell">

    <div th:replace="~{layout/sidebar :: sidebar('members')}"></div>

    <main class="main-area">

        <div th:replace="~{layout/navbar :: navbar}"></div>

        <div class="content-wrap">

            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="/members">Members</a></li>
                    <li class="breadcrumb-item active">Edit</li>
                </ol>
            </nav>

            <div class="page-card p-4">
                <h1 class="h4 mb-4">Edit Member</h1>

                <form id="memberForm" th:object="${member}">

                    <input type="hidden" id="memberId" th:field="*{id}">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="memberCode" class="form-label">Member Code</label>
                            <input type="text" id="memberCode" th:field="*{memberCode}" class="form-control" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" id="name" th:field="*{name}" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" id="phone" th:field="*{phone}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea id="address" th:field="*{address}" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lossBookCount" class="form-label">Loss Book Count</label>
                            <input type="number" id="lossBookCount" th:field="*{lossBookCount}" class="form-control">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="memberType" class="form-label">Member Type</label>
                            <select id="memberType" th:field="*{memberType}" class="form-select" required>
                                <option value="">Select Type</option>
                                <option value="Student">Student</option>
                                <option value="Teacher">Teacher</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select id="status" th:field="*{status}" class="form-select" required>
                                <option value="active">active</option>
                                <option value="warning">warning</option>
                                <option value="banned">banned</option>
                                <option value="expired">expired</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="registeredDate" class="form-label">Registered Date</label>
                            <input type="date" id="registeredDate" th:field="*{registeredDate}" class="form-control" required>
                        </div>
        
                        <div class="col-md-4 mb-3">
                            <label for="expiredDate" class="form-label">Expired Date</label>
                            <input type="date" id="expiredDate" th:field="*{expiredDate}" class="form-control" required>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-warning text-dark">
                            <i class="bi bi-save me-1"></i> Update
                        </button>
                        <a href="/members" class="btn btn-secondary">Cancel</a>
                    </div>

                </form>
            </div>

            <div th:replace="~{layout/footer :: footer}"></div>

        </div>

    </main>

</div>

<div th:replace="~{layout/master :: scripts}"></div>

<!-- JavaScript Event Listener & Date Fixer -->
<script>
// Page စတင်ဖွင့်ချိန်တွင် Database မှ Date များကို Input ၌ မှန်ကန်စွာ ဝင်ရောက်ပေါ်စေရန်
document.addEventListener("DOMContentLoaded", function() {
    const regDateVal = "[[${member.registeredDate}]]";
    const expDateVal = "[[${member.expiredDate}]]";

    if (regDateVal && regDateVal !== "null" && regDateVal !== "") {
        document.getElementById("registeredDate").value = regDateVal.split("T")[0];
    }
    if (expDateVal && expDateVal !== "null" && expDateVal !== "") {
        document.getElementById("expiredDate").value = expDateVal.split("T")[0];
    }
});

function formatDate(dateString) {
    if (!dateString) return null;
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return dateString;
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

document.getElementById("memberForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const memberId = document.getElementById("memberId")?.value;
    
    const member = {
        memberCode: document.getElementById("memberCode").value,
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        address: document.getElementById("address").value,
        memberType: document.getElementById("memberType").value,
        lossBookCount: document.getElementById("lossBookCount").value ? parseInt(document.getElementById("lossBookCount").value) : 0,
        status: document.getElementById("status").value,
        registeredDate: formatDate(document.getElementById("registeredDate").value),
        expiredDate: formatDate(document.getElementById("expiredDate").value)
    };

    console.log("Sending Member Data:", member); 

    const url = memberId ? `/api/members/${memberId}` : "/api/members";
    const method = memberId ? "PUT" : "POST";

    try {
        const response = await fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(member)
        });

        if (response.ok) {
            const successMsg = memberId ? "Member updated successfully." : "Member created successfully.";
            alert(successMsg);
            window.location.href = "/members";
        } else {
            const errorText = await response.text();
            console.error("Server Error Response:", errorText);
            alert("Operation failed. Status: " + response.status);
        }
    } catch (error) {
        console.error("Error:", error);
        alert("An error occurred.");
    }
});
</script>

</body>
</html>
