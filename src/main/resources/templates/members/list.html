<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head('Members')}"></head>

<body>
    <div class="app-shell">
        <div th:replace="~{layout/sidebar :: sidebar('members')}"></div>
        <main class="main-area">
            <div th:replace="~{layout/navbar :: navbar}"></div>
            <div class="content-wrap">
                <nav>
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
                        <li class="breadcrumb-item active">Members</li>
                    </ol>
                </nav>
                <div class="page-card p-3">
            
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h1 class="h4 mb-0">Members</h1>
                        <a class="btn btn-matcha" href="/members/create">
                            <i class="bi bi-plus-lg me-1"></i>Create
                        </a>
                    </div>
                    
                    <table class="table table-striped table-bordered datatable w-100">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Member Code</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Registered Date</th>
                                <th>Expired Date</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="member : ${members}">
                                <td th:text="${member.id}"></td>
                                <td th:text="${member.memberCode}"></td>
                                <td th:text="${member.name}"></td>
                                <td th:text="${member.email}"></td>
                                <td>
                                    <span th:text="${member.status}" 
                                        th:classappend="${member.status == 'banned' ? 'badge bg-danger' : 
                                                        (member.status == 'warning' ? 'badge bg-warning' : 'badge bg-success')}">
                                    </span>
                                </td>
                                <td th:text="${member.registeredDate != null ? #temporals.format(member.registeredDate, 'yyyy-MM-dd') : '-'}"></td>
                                <td th:text="${member.expiredDate != null ? #temporals.format(member.expiredDate, 'yyyy-MM-dd') : '-'}"></td>
                                <td class="text-center">
                            
                                    <a class="btn btn-sm btn-info" th:href="@{/members/details/{id}(id=${member.id})}">
                                        <i class="bi bi-eye"></i>
                                    </a>
                       
                                    <a class="btn btn-sm btn-warning" th:href="@{/members/edit/{id}(id=${member.id})}">
                                        <i class="bi bi-pencil"></i>
                                    </a>
       
                                    <form th:action="@{/members/delete/{id}(id=${member.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this record?');">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:replace="~{layout/footer :: footer}"></div>
            </div>
        </main>
    </div>
    
    <!-- DataTables CSS & JS Dependencies -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    
    <div th:replace="~{layout/master :: scripts}"></div>

    <!-- DataTable Initialization Script -->
    <script>
    $(function () {
        if (!$.fn.DataTable.isDataTable('.datatable')) {
            $('.datatable').DataTable({
                responsive: true,
                autoWidth: false,
                pageLength: 10,
                columnDefs: [
                    {
                        orderable: false,
                        targets: 6 
                    }
                ]
            });
        }
    });
    </script>
    
</body>

</html>
