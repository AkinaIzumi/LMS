<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/master :: head('Login')}"></head>
<body class="login-page d-flex align-items-center justify-content-center p-3">
  <main class="glass-card p-4 shadow-lg">
    <div class="text-center mb-4">
      <div class="fs-1"><img th:src="@{/img/ucspyay.jpg}" alt="UCSP"></div>
      <h1 class="h3 fw-bold mb-1">LMS</h1>
      <p class="mb-0">School Library Management System</p>
    </div>
    <h2 class="h4 fw-bold mb-3">Welcome Back</h2>
    <form action="/login" method="post">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" placeholder="admin@school.edu" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" type="password" placeholder="Enter password" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" id="rememberMe" type="checkbox">
          <label class="form-check-label" for="rememberMe">Remember Me</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" id="showPassword" type="checkbox">
          <label class="form-check-label" for="showPassword">Show Password</label>
        </div>
      </div>
      <button class="btn btn-matcha w-100" type="submit">Login</button>
    </form>
  </main>
  <div th:replace="~{layout/master :: scripts}"></div>
</body>
</html>
