<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/master :: head('Login')}"></head>
<body class="login-page d-flex align-items-center justify-content-center p-3">
  
  <main class="glass-card p-4 shadow-lg rounded-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">

      <div class="mb-2">
        <img th:src="@{/img/ucspyay.jpg}" alt="UCSP" class="rounded-2 shadow-sm" style="width: 65px; height: 65px; object-fit: cover;">
      </div>

      <h1 class="h5 fw-bold text-white mb-1">University of Computer Studies, Pyay</h1>
      <p class="text-white small mb-0">Library Management System</p>
    </div>

    <h2 class="h5 fw-bold mb-3 text-white text-center">Welcome Back</h2>
    
    <form th:action="@{/login}" method="post">
      <div th:if="${loginError}" class="alert alert-danger py-1 px-2 small text-center mb-3" th:text="${loginError}"></div>
      
      <div class="mb-3">
        <label class="form-label fw-semibold text-white" for="username">Username</label>
        <input class="form-control" id="username" name="username" type="text" placeholder="Enter username" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold text-white" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" placeholder="Enter password" required>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4 text-white">
        <div class="form-check">
          <input class="form-check-input" id="rememberMe" type="checkbox" name="remember-me">
          <label class="form-check-label" for="rememberMe">Remember Me</label>
        </div>
      </div>

      <button class="btn btn-success w-100 py-2 fw-bold text-white shadow-sm" type="submit">Login</button>
    </form>
  </main>

  <div th:replace="~{layout/master :: scripts}"></div>
</body>
</html>
