<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head('Transactions')}"></head>

<body>
    <div class="app-shell">
        <div th:replace="~{layout/sidebar :: sidebar('transactions')}"></div>
        <main class="main-area">
            <div th:replace="~{layout/navbar :: navbar}"></div>
            <div class="content-wrap">
                <nav>
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
                        <li class="breadcrumb-item active">Transactions</li>
                    </ol>
                </nav>
                <div class="page-card p-3">
            
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h1 class="h4 mb-0">Transactions</h1>
                        <a class="btn btn-matcha" href="/transactions/borrow">
                            <i class="bi bi-plus-lg me-1"></i>Borrow Transaction
                        </a>
                    </div>
                    
                    <table class="table table-striped table-bordered datatable w-100">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Transaction Code</th>
                                <th>Member Name</th>
                                <th>Book Title</th>
                                <th>Status</th>
                                <th>Transaction Date</th>
                                <th>Due Date</th>
                                <th>Return Date</th>
                                <th>Fine</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="tx : ${transactions}">
                                <td th:text="${tx.id}"></td>
                                <td th:text="${tx.transactionCode}"></td>
                                <td th:text="${tx.member != null ? tx.member.name : '-'}"></td>
                                <td th:text="${tx.book != null ? tx.book.title : '-'}"></td>
                                <td>
                                    <span class="badge" 
                                        th:classappend="${tx.status == 'Borrowed' ? 'bg-warning text-dark' : (tx.status == 'OVERDUE' || tx.status == 'loss or damage' ? 'bg-danger' : 'bg-success')}"
                                        th:text="${tx.status}"></span>
                                </td>
                                <td th:text="${tx.borrowDate != null ? tx.borrowDate : '-'}"></td>
                                <td th:text="${tx.dueDate != null ? tx.dueDate : '-'}"></td>
                                <td th:text="${tx.returnDate != null ? tx.returnDate : '-'}"></td>
                                <td>
                                    <span th:text="${tx.fine != null ? tx.fine : 0.0}" 
                                        th:class="${tx.fine > 0 ? 'text-danger fw-bold' : ''}">
                                    </span>
                                </td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center align-items-center gap-1">
                                        <a class="btn btn-sm btn-info text-white d-inline-flex justify-content-center align-items-center"
                                        style="width: 32px; height: 32px; padding: 0;"
                                        th:href="@{/transactions/detail/{id}(id=${tx.id})}" title="View">
                                            <i class="bi bi-eye"></i>
                                        </a>

                                        <button type="button" class="btn btn-sm btn-success d-inline-flex justify-content-center align-items-center" 
                                                style="width: 32px; height: 32px; padding: 0;"
                                                th:if="${tx.status == 'Borrowed' or tx.status == 'OVERDUE'}" 
                                                th:onclick="openReturnModal([[${tx.id}]])" 
                                                title="Return Book">
                                            <i class="bi bi-arrow-return-left"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:replace="~{layout/footer :: footer}"></div>
            </div>
        </main>
    </div>
    
    <!-- Return Option Modal -->
    <div class="modal fade" id="returnModal" tabindex="-1" aria-labelledby="returnModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="returnModalLabel">Select Return Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modalTransactionId">
                    <div class="mb-3">
                        <label for="returnStatusSelect" class="form-label">Choose Action:</label>
                        <select id="returnStatusSelect" class="form-select">
                            <option value="RETURNED"> Return </option>
                            <option value="loss or damage">Loss or Damage</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitReturn()">Confirm</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- DataTables CSS & JS Dependencies -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    
    <div th:replace="~{layout/master :: scripts}"></div>

    <!-- DataTable Initialization Script -->
    <script>
    $(function () {
        if (!$.fn.DataTable.isDataTable('.datatable')) {
            $('.datatable').DataTable({
                responsive: true,
                autoWidth: false,
                pageLength: 10,
                columnDefs: [
                    {
                        orderable: false,
                        targets: -1 
                    }
                ]
            });
        }
    });
    </script>

    <!-- Return Book Modal & AJAX Script -->
    <script>
    let returnModal;
    
    document.addEventListener("DOMContentLoaded", function() {
        returnModal = new bootstrap.Modal(document.getElementById('returnModal'));
    });

    function openReturnModal(id) {
        document.getElementById('modalTransactionId').value = id;
        document.getElementById('returnStatusSelect').value = 'RETURNED';
        returnModal.show();
    }

    async function submitReturn() {
        const id = document.getElementById('modalTransactionId').value;
        const status = document.getElementById('returnStatusSelect').value;

        try {
            const response = await fetch(`/api/transactions/return/${id}?status=${encodeURIComponent(status)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            if (response.ok) {
                window.location.reload(); 
            } else {
                alert("Failed to process the return.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("An error occurred.");
        }
    }
    </script>
    
</body>

</html>
