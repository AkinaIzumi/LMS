<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/master :: head('Transaction Detail')}"></head>
<body>
    <div class="app-shell">
        <div th:replace="~{layout/sidebar :: sidebar('transactions')}"></div>
        <main class="main-area">
            <div th:replace="~{layout/navbar :: navbar}"></div>
            <div class="content-wrap">
                <nav>
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/transactions">Transactions</a></li>
                        <li class="breadcrumb-item active">Detail</li>
                    </ol>
                </nav>
                <div class="page-card p-4">
                    <h2 class="h4 mb-4">Transaction Details</h2>
                    
                    <ul class="list-group list-group-flush mb-4">
                        <li class="list-group-item"><strong>ID:</strong> <span th:text="${transaction.id}"></span></li>
                        <li class="list-group-item"><strong>Transaction Code:</strong> <span th:text="${transaction.transactionCode}"></span></li>
                        <li class="list-group-item"><strong>Member Name:</strong> <span th:text="${transaction.member != null ? transaction.member.name : '-'}"></span></li>
                        <li class="list-group-item"><strong>Member Email:</strong> <span th:text="${transaction.member != null ? transaction.member.email : '-'}"></span></li>
                        <li class="list-group-item"><strong>Book Title:</strong> <span th:text="${transaction.book != null ? transaction.book.title : '-'}"></span></li>
                        
                        <li class="list-group-item">
                            <strong>Status:</strong> 
                            <span class="badge" 
                                  th:classappend="${transaction.status == 'Borrowed' ? 'bg-warning text-dark' : (transaction.status == 'RETURNED' ? 'bg-success' : 'bg-danger')}" 
                                  th:text="${transaction.status}"></span>
                        </li>

                        <li class="list-group-item"><strong>Borrow Date:</strong> <span th:text="${transaction.borrowDate != null ? transaction.borrowDate : '-'}"></span></li>
                        <li class="list-group-item"><strong>Due Date:</strong> <span th:text="${transaction.dueDate != null ? transaction.dueDate : '-'}"></span></li>
                        
                        <li class="list-group-item"><strong>Return Date:</strong> <span th:text="${transaction.returnDate != null ? transaction.returnDate : '-'}"></span></li>

                        <li class="list-group-item">
                            <strong>Fine:</strong> 
                            <span th:text="${transaction.fine != null ? transaction.fine : 0.0}"
                                  th:class="${transaction.fine > 0 ? 'text-danger fw-bold' : ''}">
                            </span>
                        </li>
                    </ul>

                    <a href="/transactions" class="btn btn-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Back to Transactions
                    </a>
                </div>
                <div th:replace="~{layout/footer :: footer}"></div>
            </div>
        </main>
    </div>
    <div th:replace="~{layout/master :: scripts}"></div>
</body>
</html>
