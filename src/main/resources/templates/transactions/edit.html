<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head('Edit Transaction')}"></head>

<body>
<div class="app-shell">

    <div th:replace="~{layout/sidebar :: sidebar('transactions')}"></div>

    <main class="main-area">

        <div th:replace="~{layout/navbar :: navbar('Edit Transaction')}"></div>

        <div class="content-wrap">

            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="/transactions">Transactions</a></li>
                    <li class="breadcrumb-item active">Edit</li>
                </ol>
            </nav>

            <div class="page-card p-4">
                <h1 class="h4 mb-4">Edit Transaction</h1>

                <form id="transactionForm" th:object="${transaction}">
                    
                    <!-- Update အတွက် ID ကို သိမ်းဆည်းရန် Hidden Input -->
                    <input type="hidden" id="transactionId" th:field="*{id}">

                    <div class="row">
                        <!-- Member Selection -->
                        <div class="col-md-6 mb-3">
                            <label for="memberIdSelect" class="form-label">Member</label>
                            <select id="memberIdSelect" class="form-select" th:field="*{member.id}" required>
                                <option value="">Select Member</option>
                                <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name}"></option>
                            </select>
                        </div>

                        <!-- Book Selection (Locked / Disabled) -->
                        <div class="col-md-6 mb-3">
                            <label for="bookIdSelect" class="form-label">Book (Cannot be changed)</label>
                            <!-- UI တွင် ပြောင်းမရအောင် disabled လုပ်ထားသည် -->
                            <select id="bookIdSelect" class="form-select" th:field="*{book.id}" disabled>
                                <option th:each="b : ${books}" th:value="${b.id}" th:text="${b.title}"></option>
                            </select>
                            <!-- Backend သို့ ID တန်ဖိုး တိကျစွာ ပါသွားစေရန် Hidden Input ထည့်ပေးထားသည် -->
                            <input type="hidden" id="bookIdHidden" th:field="*{book.id}">
                        </div>
                    </div>

                    <div class="row">
                        <!-- Due Date -->
                        <div class="col-md-6 mb-3">
                            <label for="dueDate" class="form-label">Due Date</label>
                            <input type="date" id="dueDate" th:field="*{dueDate}" class="form-control" required>
                        </div>

                        <!-- Status -->
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select id="status" th:field="*{status}" class="form-select" required>
                                <option value="BORROWED">BORROWED</option>
                                <option value="RETURNED">RETURNED</option>
                                <option value="OVERDUE">OVERDUE</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-warning text-dark">
                            <i class="bi bi-save me-1"></i> Update Transaction
                        </button>
                        <a href="/transactions" class="btn btn-secondary">Cancel</a>
                    </div>

                </form>
            </div>

            <div th:replace="~{layout/footer :: footer}"></div>

        </div>

    </main>

</div>

<div th:replace="~{layout/master :: scripts}"></div>

<!-- JavaScript Event Listener (AJAX Fetch) -->
<script>
document.getElementById("transactionForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const transactionId = document.getElementById("transactionId")?.value;
    const transaction = {
        member: { id: document.getElementById("memberIdSelect").value },
        book: { id: document.getElementById("bookIdHidden").value }, // Hidden input မှ Book ID ကို ယူမည်
        dueDate: document.getElementById("dueDate").value,
        status: document.getElementById("status").value
    };

    const url = `/api/transactions/${transactionId}`;
    const method = "PUT";

    try {
        const response = await fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(transaction)
        });

        if (response.ok) {
            alert("Transaction updated successfully.");
            window.location.href = "/transactions";
        } else {
            alert("Operation failed. Status: " + response.status);
        }
    } catch (error) {
        console.error("Error:", error);
        alert("An error occurred.");
    }
});
</script>

</body>
</html>
