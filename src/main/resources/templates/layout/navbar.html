<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm px-4" 
     th:fragment="navbar"
     xmlns:th="http://www.thymeleaf.org" 
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container-fluid">
        <!-- Brand / Logo -->
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}" style="color: #4E7C59;">
            <i class="fas fa-book-reader me-2"></i>LMS Library
        </a>

        <!-- Right Side Profile & Auto Avatar -->
        <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle d-flex align-items-center text-dark" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <!-- Auto Generated Avatar from Username -->
                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-2 fw-bold" 
                         style="width: 38px; height: 38px; font-size: 15px;"
                         th:text="${#strings.substring(#authentication.principal.username, 0, 1).toUpperCase()}">
                         U
                    </div>
                    <div class="d-flex flex-column text-start">
                        <!-- Username သီးသန့်ပြရန် -->
                        <span class="fw-semibold" sec:authentication="principal.username">Username</span>
                    </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="userDropdown">
                    <li><a class="dropdown-item py-2" th:href="@{/profile}"><i class="fas fa-user me-2 text-secondary"></i>My Profile</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="px-3 py-2">
                            <button type="submit" class="btn btn-outline-danger btn-sm w-100"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
                        </form>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>
</body>
</html>
